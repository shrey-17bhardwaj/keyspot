name: keyspot_example
description: Demonstrations of every keyspot feature, one page per use case.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Used only to demo an SVG pointer — keyspot itself has zero dependencies.
  flutter_svg: ^2.0.0
  keyspot:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
