name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Analyze, test, dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: Score with pana
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 20 .

  example-web:
    name: Build example for web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build web demo
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release --base-href /keyspot/

      - name: Upload demo
        uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: example/build/web

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy-demo:
    name: Deploy demo to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: example-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Creates/enables the Pages site if the repo doesn't have one yet, so
      # the deploy never depends on a manual Settings -> Pages click.
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
