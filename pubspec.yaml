name: keyspot
description: >-
  Drift-free spotlight highlights and animated hand-pointer gestures for
  onboarding and feature tours. Anchored to GlobalKeys, tracked live every frame.
version: 0.3.0
repository: https://github.com/shrey-17bhardwaj/keyspot
issue_tracker: https://github.com/shrey-17bhardwaj/keyspot/issues

topics:
  - onboarding
  - showcase
  - tutorial
  - spotlight
  - walkthrough

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
